server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A SPA usa /api na mesma origem. Encaminha para o Paperclip na porta 3100
    # do host, mantendo Host/Origin para o guard de mutações do board.
    location /api/ {
        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Rotas do cliente (/new, /agents/:ref, etc.) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
