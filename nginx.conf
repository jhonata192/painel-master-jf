map $http_upgrade $connection_upgrade {
    default upgrade;
    '' "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Encaminha sessões por cookie e WebSockets para o Paperclip na porta 3100 do host.
    location /api/ {
        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "https://paperclip.masterjf-solucoes.com.br";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cookie_flags ~ nosecure;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Rotas do cliente (/new, /agents/:ref, etc.) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
