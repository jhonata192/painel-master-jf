server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Injeta o board token em todas as chamadas /api/
    # e faz proxy para o Paperclip na porta 3100 do host.
    location /api/ {
        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Board token injetado pelo servidor — nunca exposto no frontend
        proxy_set_header Authorization "Bearer pcp_board_052bb8ac02538f9063c81334a28617b9070d6b7913e4004a";
    }

    # Rotas do cliente (/new, /agents/:ref, etc.) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
